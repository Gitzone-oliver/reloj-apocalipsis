name: reloj-diario
on:
  schedule:
    - cron: "0 12 * * *"      # 12:00 UTC = 06:00 Ciudad de Mexico
  workflow_dispatch:           # boton "Run workflow" para probar
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python spider.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          DATA_PATH: docs/data.json
      - run: |
          git config user.name "reloj-bot"
          git config user.email "reloj-bot@users.noreply.github.com"
          git add docs/data.json
          git commit -m "datos $(date -u +%F)" || echo "sin cambios"
          git push
